# Put an authenticating proxy (oauth2-proxy, Cloudflare Access, Pomerium…) in
# front of `app`. It must set `Remote-Email` and drop any client-sent value.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: anki
      POSTGRES_USER: anki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anki}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anki -d anki"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgres://anki:${POSTGRES_PASSWORD:-anki}@db:5432/anki?sslmode=disable
      PORT: "8080"
      WEB_ROOT: /web
      LOG_LEVEL: INFO
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
